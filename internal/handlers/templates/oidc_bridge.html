<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>散页 · 登录完成</title>
  <style nonce="{{.CSPNonce}}">
    :root {
      --bg-archive: #f9f8f5;
      --bg-subtle: #f2f0eb;
      --ink-primary: #181716;
      --ink-secondary: #57544e;
      --ink-muted: #8c8880;
      --border-subtle: rgba(24, 23, 22, 0.10);
      --border-divider: rgba(24, 23, 22, 0.16);
      --accent-warm: #a24f2b;
      --accent-moss: #3f5a4a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-archive: #141312;
        --bg-subtle: #1d1b19;
        --ink-primary: #ede8e1;
        --ink-secondary: #a8a399;
        --ink-muted: #6e6a62;
        --border-subtle: rgba(237, 232, 225, 0.10);
        --border-divider: rgba(237, 232, 225, 0.16);
        --accent-warm: #c85635;
        --accent-moss: #507661;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background-color: var(--bg-archive);
      color: var(--ink-primary);
      font-family: "Newsreader", "Songti SC", "Source Han Serif SC", Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      padding: 32px 28px;
    }
    .kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--accent-moss);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 12px;
      text-wrap: balance;
    }
    .desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink-secondary);
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-block-size: 44px;
      padding: 12px 16px;
      background-color: var(--accent-warm);
      color: #ffffff;
      border: 1px solid var(--accent-warm);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent-warm);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-primary { transition: none; }
    }
    .colophon {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="kicker">Vesper Auth · 登录验证通过</div>
    <h1>正在返回《散页》{{.PlatformLabel}}</h1>
    <p class="desc">
      {{if .AccountLabel}}已验证账号 {{.AccountLabel}}，{{end}}正在自动唤起本地应用完成登录。若应用未自动打开，请点击下方按钮继续（本次登录授权码 {{.ExpiresSeconds}} 秒内有效）。
    </p>

    <div class="actions">
      <a id="open-app-link" class="btn-primary" href="{{.DeepLinkURL}}">打开《散页》完成登录</a>
    </div>

    <div class="colophon">
      <div>服务器地址：{{.HubURL}}</div>
      <div>登录完成后可直接关闭此浏览器页面。</div>
    </div>
  </main>

  <script nonce="{{.CSPNonce}}">
    (function () {
      var openLink = document.getElementById('open-app-link');
      if (openLink) {
        var href = openLink.getAttribute('href');
        if (href && (href.indexOf('looseleaf://auth/callback?') === 0 || href.indexOf('looseleaf://pair?') === 0)) {
          window.requestAnimationFrame(function () {
            window.location.assign(href);
          });
        }
      }
    })();
  </script>
</body>
</html>
