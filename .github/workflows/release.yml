name: Single Binary Embed Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Embed Single Binaries & Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js (Fallback Web Builder)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Frontend Release Asset or Build (web/dist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p web/dist
          echo "Preparing frontend assets for embedding (docs/ecosystem.md §10.4)..."
          
          FETCH_SUCCESS=false
          # 1. 尝试从 Losse-Leaf/web Release 中下载与当前 Tag 对应的 web-dist.tar.gz
          if gh release download "${TAG}" --repo Losse-Leaf/web --pattern "web-dist.tar.gz" --dir /tmp/ 2>/dev/null; then
            echo "Successfully downloaded web-dist.tar.gz for tag ${TAG} from Losse-Leaf/web."
            FETCH_SUCCESS=true
          elif gh release download --repo Losse-Leaf/web --pattern "web-dist.tar.gz" --dir /tmp/ 2>/dev/null; then
            echo "Successfully downloaded latest available web-dist.tar.gz from Losse-Leaf/web."
            FETCH_SUCCESS=true
          fi
          
          if [ "$FETCH_SUCCESS" = "true" ] && [ -f /tmp/web-dist.tar.gz ]; then
            echo "Extracting web-dist.tar.gz into web/dist/..."
            tar -xzf /tmp/web-dist.tar.gz -C web/dist/
          else
            echo "Notice: Prebuilt web-dist.tar.gz not found in releases. Building from Losse-Leaf/web main branch..."
            git clone --depth=1 https://github.com/Losse-Leaf/web.git /tmp/looseleaf-web
            cd /tmp/looseleaf-web
            npm ci || npm install
            npm run build
            cp -r dist/* $GITHUB_WORKSPACE/web/dist/
            cd $GITHUB_WORKSPACE
          fi
          
          # 验证 index.html 存在，保证内嵌完整性
          if [ ! -f web/dist/index.html ]; then
            echo "Error: web/dist/index.html not found! Single binary cannot be built."
            exit 1
          fi
          echo "Web frontend assets successfully staged in web/dist/:"
          ls -la web/dist/

      - name: Compile Cross-Platform Standalone Single Binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-dist
          
          declare -a TARGETS=(
            "linux/amd64/looseleaf-linux-amd64"
            "linux/arm64/looseleaf-linux-arm64"
            "darwin/amd64/looseleaf-darwin-amd64"
            "darwin/arm64/looseleaf-darwin-arm64"
            "windows/amd64/looseleaf-windows-amd64.exe"
          )
          
          for target in "${TARGETS[@]}"; do
            IFS="/" read -r os arch output <<< "$target"
            echo "Compiling single binary for ${os}/${arch} -> release-dist/${output}..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'loose-leaf/internal/config.Version=${VERSION}'" \
              -o "release-dist/${output}" .
          done
          
          cd release-dist
          sha256sum looseleaf-* > checksums.txt
          echo "Generated SHA256 checksums:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/looseleaf-*
            release-dist/checksums.txt
          name: Loose-Leaf ${{ github.ref_name }}
          body: |
            ## Loose-Leaf 散页数字档案核心（单二进制开箱即用版本）
            
            根据 `docs/ecosystem.md` §十.4 规范自动构建的去 Docker 化单二进制产物，内嵌完整 Web 静态展厅。无需配置 Node.js 或 Docker，下载后赋予执行权限即可直接运行：
            
            ```bash
            # Linux x86_64
            chmod +x looseleaf-linux-amd64 && ./looseleaf-linux-amd64
            
            # Apple Silicon Mac (M1/M2/M3/M4)
            chmod +x looseleaf-darwin-arm64 && ./looseleaf-darwin-arm64
            ```
            
            ### 校验和 (SHA-256)
            见附件 `checksums.txt`。
          draft: false
          prerelease: false
