name: Backend Quality Gate (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Go Test & Static Analysis Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Static Code Analysis (go vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests (go test)
        run: go test -v ./...

      - name: Verify Single Binary Compilation
        run: CGO_ENABLED=0 go build -v -o /dev/null .
